# Backend + PostgreSQL. Flutter tətbiqi ayrıca işlədilir (mobile/ qovluğu, README-yə bax).
# İlk dəfə:  cp .env.example .env   (və dəyərləri dəyişin)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bakuflow}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD təyin edilməyib - .env faylını yaradın (cp .env.example .env)}"
      POSTGRES_DB: ${POSTGRES_DB:-bakuflow}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5433}:5432"   # yalnız lokal maşından əlçatan
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Bağlantı məlumatı yalnız backend-ə verilir; mobil tətbiqə heç bir məxfi məlumat daxil edilmir
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-bakuflow}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-bakuflow}"
      SESSION_HASH_SECRET: "${SESSION_HASH_SECRET:?SESSION_HASH_SECRET təyin edilməyib - .env faylını yaradın}"
      DEMO_ENDPOINTS_ENABLED: ${DEMO_ENDPOINTS_ENABLED:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      SIM_AUTOSTART: ${SIM_AUTOSTART:-true}
    volumes:
      - ./backend/data:/app/data:ro   # dayanacaqlar.csv bura qoyulur
    ports:
      - "8000:8000"

volumes:
  pgdata:
